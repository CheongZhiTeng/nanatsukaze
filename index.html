<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nanatsukaze · Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Splash screen -->
  <div id="splash">
    <img src="pictures/logo.jpg" alt="Nanatsukaze" class="splash-logo">
  </div>

  <main class="app">
    <!-- Player -->
    <section class="player-section">
      <div class="cover-wrap">
        <div id="player" class="youtube-player"></div>
        <div class="cover-overlay"></div>
      </div>

      <div class="song-info">
        <h1 id="songTitle">—</h1>
        <p id="songArtist">Nanatsukaze</p>
      </div>

      <div class="progress-wrap">
        <span id="currentTime">0:00</span>
        <input type="range" id="progressBar" value="0" min="0" max="100" step="0.1">
        <span id="totalTime">0:00</span>
      </div>

      <div class="controls">
        <!-- Shuffle -->
        <button id="shuffleBtn" class="ctrl-btn small" title="Shuffle" aria-label="Shuffle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="16 3 21 3 21 8"/>
            <line x1="4" y1="20" x2="21" y2="3"/>
            <polyline points="21 16 21 21 16 21"/>
            <line x1="15" y1="15" x2="21" y2="21"/>
            <line x1="4" y1="4" x2="9" y2="9"/>
          </svg>
        </button>

        <!-- Previous -->
        <button id="prevBtn" class="ctrl-btn" title="Previous" aria-label="Previous">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <rect x="5" y="6" width="2.5" height="12" rx="1.25"/>
            <path d="M19 6.6v10.8c0 .66-.75 1.04-1.29.65L10.2 12.65a.8.8 0 0 1 0-1.3l7.51-5.4c.54-.39 1.29 0 1.29.65z"/>
          </svg>
        </button>

        <!-- Play / Pause -->
        <button id="playBtn" class="ctrl-btn primary" title="Play / Pause" aria-label="Play">
          <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M8 5.14v13.72c0 .82.88 1.32 1.57.9l10.97-6.86a1.05 1.05 0 0 0 0-1.8L9.57 4.24A1.05 1.05 0 0 0 8 5.14z"/>
          </svg>
          <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <rect x="7" y="5" width="3.5" height="14" rx="1.25"/>
            <rect x="13.5" y="5" width="3.5" height="14" rx="1.25"/>
          </svg>
        </button>

        <!-- Next -->
        <button id="nextBtn" class="ctrl-btn" title="Next" aria-label="Next">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <rect x="16.5" y="6" width="2.5" height="12" rx="1.25"/>
            <path d="M5 6.6v10.8c0 .66.75 1.04 1.29.65l7.51-5.4a.8.8 0 0 0 0-1.3L6.29 5.95C5.75 5.56 5 5.94 5 6.6z"/>
          </svg>
        </button>

        <!-- Repeat -->
        <button id="repeatBtn" class="ctrl-btn small" title="Repeat Off" aria-label="Repeat">
          <svg class="icon-repeat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="23 4 23 10 17 10"/>
            <polyline points="1 20 1 14 7 14"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/>
            <path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"/>
          </svg>
          <svg class="icon-repeat-one" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="23 4 23 10 17 10"/>
            <polyline points="1 20 1 14 7 14"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/>
            <path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"/>
            <path d="M11 9.5v5m-1-4 1-.5"/>
          </svg>
        </button>
      </div>

      <div class="volume-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" stroke="none"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
        </svg>
        <input type="range" id="volumeBar" min="0" max="100" value="80" aria-label="Volume">
      </div>
    </section>

    <!-- Playlist -->
    <aside class="playlist-section">
      <h2>Playlist</h2>
      <ul id="playlist"></ul>
    </aside>
  </main>

  <!-- Splash dismiss script (independent from app.js) -->
  <script>
    (function () {
      const dismiss = () => {
        const splash = document.getElementById('splash');
        if (splash && !splash.classList.contains('hide')) {
          splash.classList.add('hide');
          setTimeout(() => splash.remove(), 800);
        }
      };
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => setTimeout(dismiss, 2200));
      } else {
        setTimeout(dismiss, 2200);
      }
      setTimeout(dismiss, 5000);
    })();
  </script>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
