<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nanatsukaze · Music</title>

  <!-- Preconnect to YouTube + Google infrastructure -->
  <link rel="preconnect" href="https://www.youtube.com">
  <link rel="preconnect" href="https://www.youtube-nocookie.com">
  <link rel="preconnect" href="https://youtubei.googleapis.com">
  <link rel="preconnect" href="https://i.ytimg.com">
  <link rel="preconnect" href="https://yt3.ggpht.com">
  <link rel="preconnect" href="https://googlevideo.com" crossorigin>
  <link rel="preconnect" href="https://www.google.com">
  <link rel="preconnect" href="https://static.doubleclick.net">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- DNS fallback for browsers that skip preconnect -->
  <link rel="dns-prefetch" href="https://www.youtube.com">
  <link rel="dns-prefetch" href="https://www.youtube-nocookie.com">
  <link rel="dns-prefetch" href="https://i.ytimg.com">
  <link rel="dns-prefetch" href="https://yt3.ggpht.com">
  <link rel="dns-prefetch" href="https://googlevideo.com">

  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Michroma:ital,wght@0,400&display=swap" rel="stylesheet">
</head>
<body>

  <canvas id="bgCanvas" class="bg-canvas" aria-hidden="true"></canvas>
  <div class="bg-grid" aria-hidden="true"></div>

  <div id="splash" aria-hidden="true">
    <img src="pictures/logo.png" alt="" class="splash-logo">
  </div>

  <div id="app">
    <main id="galleryView">
      <header class="gallery-header">
        <div class="gallery-brand">
          <img class="gallery-logo" src="pictures/IMG_0703.png" alt="Nanatsukaze">
        </div>

        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" id="searchInput" class="search-input"
                 placeholder="Search songs..." autocomplete="off"
                 autocorrect="off" autocapitalize="off" spellcheck="false"
                 aria-label="Search songs">
        </div>

        <nav class="social-links" aria-label="Social media">
          <a href="https://www.instagram.com/nanatsukaze_?stkn=MThzaGhrdm10b2x1Mw=="
             target="_blank" rel="noopener noreferrer" class="social-btn" aria-label="Instagram">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zM5.838 12a6.162 6.162 0 1 1 12.324 0 6.162 6.162 0 0 1-12.324 0zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm4.965-10.322a1.44 1.44 0 1 1 2.881.001 1.44 1.44 0 0 1-2.881-.001z"/>
            </svg>
          </a>
          <a href="https://x.com/Nanatsukaze_ofc"
             target="_blank" rel="noopener noreferrer" class="social-btn" aria-label="X (Twitter)">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
            </svg>
          </a>
          <a href="https://youtube.com/@nanatsukaze_?si=3bdZbDZvE8moc3BR"
             target="_blank" rel="noopener noreferrer" class="social-btn" aria-label="YouTube">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
            </svg>
          </a>
        </nav>
      </header>

      <div class="gallery-grid" id="galleryGrid"></div>
    </main>

    <section id="playerView" aria-hidden="true" hidden>
      <div class="player-view-inner">
        <div class="player-layout" id="playerLayout">

          <button id="toggleSidebarBtn" class="toggle-sidebar-btn"
                  aria-label="Hide sidebar" aria-pressed="false" type="button">
            <svg class="icon-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="13 17 18 12 13 7"/>
              <polyline points="6 17 11 12 6 7"/>
            </svg>
            <svg class="icon-show" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="11 17 6 12 11 7"/>
              <polyline points="18 17 13 12 18 7"/>
            </svg>
          </button>

          <div class="player-card">
            <div class="cover-wrap">
              <div id="player" class="youtube-player"></div>
              <div class="cover-overlay"></div>
            </div>

            <div class="song-info">
              <h1 id="songTitle">—</h1>
              <p id="songArtist">Nanatsukaze</p>
            </div>

            <div class="progress-wrap">
              <span id="currentTime">0:00</span>
              <input type="range" id="progressBar" value="0" min="0" max="100" step="0.1" aria-label="Seek">
              <span id="totalTime">0:00</span>
            </div>

            <div class="controls">
              <button id="shuffleBtn" class="ctrl-btn small" title="Shuffle" aria-label="Shuffle" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polyline points="16 3 21 3 21 8"/>
                  <line x1="4" y1="20" x2="21" y2="3"/>
                  <polyline points="21 16 21 21 16 21"/>
                  <line x1="15" y1="15" x2="21" y2="21"/>
                  <line x1="4" y1="4" x2="9" y2="9"/>
                </svg>
              </button>

              <button id="prevBtn" class="ctrl-btn" title="Previous" aria-label="Previous">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <rect x="5" y="6" width="2.5" height="12" rx="1.25"/>
                  <path d="M19 6.6v10.8c0 .66-.75 1.04-1.29.65L10.2 12.65a.8.8 0 0 1 0-1.3l7.51-5.4c.54-.39 1.29 0 1.29.65z"/>
                </svg>
              </button>

              <button id="playBtn" class="ctrl-btn primary" title="Play / Pause" aria-label="Play">
                <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path d="M8 5.14v13.72c0 .82.88 1.32 1.57.9l10.97-6.86a1.05 1.05 0 0 0 0-1.8L9.57 4.24A1.05 1.05 0 0 0 8 5.14z"/>
                </svg>
                <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <rect x="7" y="5" width="3.5" height="14" rx="1.25"/>
                  <rect x="13.5" y="5" width="3.5" height="14" rx="1.25"/>
                </svg>
              </button>

              <button id="nextBtn" class="ctrl-btn" title="Next" aria-label="Next">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <rect x="16.5" y="6" width="2.5" height="12" rx="1.25"/>
                  <path d="M5 6.6v10.8c0 .66.75 1.04 1.29.65l7.51-5.4a.8.8 0 0 0 0-1.3L6.29 5.95C5.75 5.56 5 5.94 5 6.6z"/>
                </svg>
              </button>

              <button id="repeatBtn" class="ctrl-btn small" title="Repeat Off" aria-label="Repeat" aria-pressed="false">
                <svg class="icon-repeat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polyline points="23 4 23 10 17 10"/>
                  <polyline points="1 20 1 14 7 14"/>
                  <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/>
                  <path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"/>
                </svg>
                <svg class="icon-repeat-one" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polyline points="23 4 23 10 17 10"/>
                  <polyline points="1 20 1 14 7 14"/>
                  <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/>
                  <path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"/>
                  <path d="M11 9.5v5m-1-4 1-.5"/>
                </svg>
              </button>
            </div>
          </div>

          <aside class="playlist-section">
            <div class="playlist-top">
              <button id="backToGalleryBtn" class="back-btn" title="Back to Gallery" aria-label="Back to Gallery">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="3" y="3" width="7" height="7" rx="1.5"/>
                  <rect x="14" y="3" width="7" height="7" rx="1.5"/>
                  <rect x="3" y="14" width="7" height="7" rx="1.5"/>
                  <rect x="14" y="14" width="7" height="7" rx="1.5"/>
                </svg>
                <span>Gallery</span>
              </button>
            </div>
            <div class="playlist-bottom">
              <h2 class="playlist-title">Playlist</h2>
              <ul id="playlist"></ul>
            </div>
          </aside>

        </div>
      </div>
    </section>
  </div>

  <div id="miniPlayer" class="mini-player" role="button" tabindex="0" aria-label="Open player">
    <img id="miniCover" class="mini-cover" src="" alt="">
    <div class="mini-info">
      <div id="miniTitle" class="mini-title">—</div>
      <div id="miniArtist" class="mini-artist">Nanatsukaze</div>
    </div>
    <button id="miniPlayBtn" class="mini-play-btn" type="button" aria-label="Play/Pause">
      <svg class="mini-icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M8 5.14v13.72c0 .82.88 1.32 1.57.9l10.97-6.86a1.05 1.05 0 0 0 0-1.8L9.57 4.24A1.05 1.05 0 0 0 8 5.14z"/>
      </svg>
      <svg class="mini-icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <rect x="7" y="5" width="3.5" height="14" rx="1.25"/>
        <rect x="13.5" y="5" width="3.5" height="14" rx="1.25"/>
      </svg>
    </button>
  </div>

  <script>
    setTimeout(function () {
      var s = document.getElementById('splash');
      if (s && s.parentNode) s.parentNode.removeChild(s);
    }, 4000);
  </script>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
